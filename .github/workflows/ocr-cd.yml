name: AI OCR CD Pipeline
run-name: AI OCR CD • sha-${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["AI OCR CI Pipeline"]
    types: [completed]

concurrency:
  group: ocr-cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: ktb_final_ocr
  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
  TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update RunPod Template
        run: |
          RESPONSE=$(curl -s -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { saveTemplate(input: { id: \"${{ env.TEMPLATE_ID }}\", name: \"${{ env.IMAGE_NAME }}\", imageName: \"${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\", containerDiskInGb: 30, volumeInGb: 0, dockerArgs: \"\", env: [{key: \"VLLM_BASE_URL\", value: \"${{ secrets.VLLM_BASE_URL }}\"}, {key: \"VLLM_MODEL\", value: \"${{ secrets.VLLM_MODEL }}\"}, {key: \"VLLM_TIMEOUT\", value: \"${{ secrets.VLLM_TIMEOUT }}\"}] }) { id } }"
            }')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::RunPod Template 업데이트 실패: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
            exit 1
          fi

      - name: Restart RunPod Instance
        run: |
          RESPONSE=$(curl -s -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { podReset(input: { podId: \"${{ secrets.POD_ID }}\" }) { id } }"
            }')
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "::error::RunPod Pod 재시작 실패: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
            exit 1
          fi

      - name: Health Check (Pod Status Polling)
        run: |
          echo "[INFO] Waiting for RunPod pod to be RUNNING..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "query { pod(input: { podId: \"${{ secrets.POD_ID }}\" }) { desiredStatus runtime { uptimeInSeconds } } }"
              }' | jq -r '.data.pod.desiredStatus // "UNKNOWN"')

            UPTIME=$(curl -sf -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "query { pod(input: { podId: \"${{ secrets.POD_ID }}\" }) { runtime { uptimeInSeconds } } }"
              }' | jq -r '.data.pod.runtime.uptimeInSeconds // "null"')

            echo "[CHECK ${i}/40] status=${STATUS}, uptime=${UPTIME}s"

            if [ "$STATUS" = "RUNNING" ] && [ "$UPTIME" != "null" ] && [ "$UPTIME" -gt 0 ] 2>/dev/null; then
              echo "[OK] Pod is RUNNING (uptime: ${UPTIME}s)"
              exit 0
            fi

            sleep 15
          done

          echo "[FAIL] Pod did not reach RUNNING state within 10 minutes"
          exit 1

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CD }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="AI OCR 배포 성공"
            DESC="RunPod에 \`${{ env.IMAGE_TAG }}\` 배포 완료"
            COLOR=3066993
          else
            TITLE="AI OCR 배포 실패"
            DESC="RunPod 배포에 실패했습니다. Actions 로그를 확인해주세요."
            COLOR=15158332
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg msg "$COMMIT_MSG" \
            --arg tag "${{ env.IMAGE_TAG }}" \
            --arg url "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  {name: "브랜치", value: $branch, inline: true},
                  {name: "작성자", value: $author, inline: true},
                  {name: "버전", value: ("`" + $tag + "`"), inline: true},
                  {name: "커밋", value: $msg, inline: false},
                  {name: "상세", value: ("[Actions 로그](" + $url + ")"), inline: false}
                ],
                footer: {
                  text: "AI OCR CD"
                }
              }]
            }' | curl -sf -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-
