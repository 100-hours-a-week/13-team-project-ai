name: Build and Deploy to RunPod (Docker Hub)

on:
  push:
    branches: [develop]
    paths:
      - 'services/ocr/**'
      - '.github/workflows/ocr-deploy.yml'

env:
  IMAGE_NAME: ktb_final_ocr
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./services/ocr
          file: ./services/ocr/Dockerfile 
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update RunPod Template
        run: |
          FULL_IMAGE_PATH="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          
          RESPONSE=$(curl -s -X POST https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }} \
          -H "Content-Type: application/json" \
          -d "{
            \"query\": \"mutation { saveTemplate(input: { id: \\\"${{ secrets.TEMPLATE_ID }}\\\", name: \\\"${{ env.IMAGE_NAME }}\\\", imageName: \\\"$FULL_IMAGE_PATH\\\", dockerArgs: \\\"\\\", containerDiskInGb: 30, volumeInGb: 100, ports: \\\"8001/http\\\", env: [{key: \\\"VLLM_BASE_URL\\\", value: \\\"${{ secrets.VLLM_BASE_URL }}\\\"}, {key: \\\"VLLM_MODEL\\\", value: \\\"${{ secrets.VLLM_MODEL }}\\\"}, {key: \\\"VLLM_TIMEOUT\\\", value: \\\"120\\\"}, {key: \\\"LANGCHAIN_API_KEY\\\", value: \\\"${{ secrets.LANGCHAIN_API_KEY }}\\\"}, {key: \\\"LANGCHAIN_TRACING_V2\\\", value: \\\"true\\\"}, {key: \\\"LANGCHAIN_PROJECT\\\", value: \\\"moyeobab-ocr\\\"}] }) { id } }\"
          }" )
          
          echo "Template Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "errors"; then exit 1; fi

      - name: Update and Restart RunPod Instance
        run: |
          FULL_IMAGE_PATH="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          
          RESPONSE=$(curl -s -X POST https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }} \
          -H "Content-Type: application/json" \
          -d "{
            \"query\": \"mutation { podEditJob(input: { podId: \\\"${{ secrets.POD_ID }}\\\", imageName: \\\"$FULL_IMAGE_PATH\\\", containerDiskInGb: 30, volumeInGb: 100, env: [{key: \\\"VLLM_BASE_URL\\\", value: \\\"${{ secrets.VLLM_BASE_URL }}\\\"}, {key: \\\"VLLM_MODEL\\\", value: \\\"${{ secrets.VLLM_MODEL }}\\\"}, {key: \\\"VLLM_TIMEOUT\\\", value: \\\"120\\\"}, {key: \\\"LANGCHAIN_API_KEY\\\", value: \\\"${{ secrets.LANGCHAIN_API_KEY }}\\\"}, {key: \\\"LANGCHAIN_TRACING_V2\\\", value: \\\"true\\\"}, {key: \\\"LANGCHAIN_PROJECT\\\", value: \\\"moyeobab-ocr\\\"}] }) { id imageName } }\"
          }")
          echo "Pod Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q "errors"; then exit 1; fi