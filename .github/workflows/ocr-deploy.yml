name: AI OCR Deploy Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "services/ocr/**"
      - ".github/workflows/ocr-deploy.yml"

permissions:
  packages: write
  contents: read

concurrency:
  group: ocr-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: ktb_final_ocr
  IMAGE_TAG: sha-${{ github.sha }}
  TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/ocr
          file: ./services/ocr/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update RunPod Template (optional)
        run: |
          BODY=$(jq -n \
            --arg name "${{ env.IMAGE_NAME }}" \
            --arg image "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --arg port1 "8000/http" \
            --arg port2 "8001/http" \
            --argjson containerDisk 30 \
            --argjson volume 0 \
            --arg vllm_base_url "${{ secrets.VLLM_BASE_URL }}" \
            --arg vllm_model "${{ secrets.VLLM_MODEL }}" \
            --arg vllm_timeout "${{ secrets.VLLM_TIMEOUT }}" \
            '{
              name: $name,
              imageName: $image,
              containerDiskInGb: $containerDisk,
              volumeInGb: $volume,
              ports: [$port1, $port2],
              env: {
                VLLM_BASE_URL: $vllm_base_url,
                VLLM_MODEL: $vllm_model,
                VLLM_TIMEOUT: $vllm_timeout
              }
            }')

          RESPONSE=$(curl -sS -X PATCH "https://rest.runpod.io/v1/templates/${{ env.TEMPLATE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "$RESPONSE" | jq .
          if echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "[OK] Template updated"
          else
            echo "::error::RunPod Template 업데이트 실패"
            exit 1
          fi

      - name: Update RunPod Pod (single pod redeploy)
        run: |
          POD_BODY=$(jq -n \
            --arg image "${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" \
            --arg port1 "8000/http" \
            --arg port2 "8001/http" \
            --argjson containerDisk 30 \
            --arg vllm_base_url "${{ secrets.VLLM_BASE_URL }}" \
            --arg vllm_model "${{ secrets.VLLM_MODEL }}" \
            --arg vllm_timeout "${{ secrets.VLLM_TIMEOUT }}" \
            '{
              imageName: $image,
              containerDiskInGb: $containerDisk,
              ports: [$port1, $port2],
              env: {
                VLLM_BASE_URL: $vllm_base_url,
                VLLM_MODEL: $vllm_model,
                VLLM_TIMEOUT: $vllm_timeout
              }
            }')

          echo "[INFO] Updating Pod: ${{ secrets.POD_ID }}"
          echo "$POD_BODY" | jq .

          POD_RESPONSE=$(curl -sS -X POST "https://rest.runpod.io/v1/pods/${{ secrets.POD_ID }}/update" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$POD_BODY")

          echo "$POD_RESPONSE" | jq .
          # 응답 포맷이 환경마다 달라서, 실패 케이스만 확실히 잡자
          if echo "$POD_RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::error::RunPod Pod update 실패"
            exit 1
          fi

          echo "[OK] Pod update requested"

      - name: Pod Status Polling (wait until RUNNING)
        run: |
          echo "[INFO] Waiting for RunPod pod to be RUNNING..."
          for i in $(seq 1 60); do
            RESULT=$(curl -sf -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "query { pod(input: { podId: \"${{ secrets.POD_ID }}\" }) { desiredStatus runtime { uptimeInSeconds } } }"
              }')

            STATUS=$(echo "$RESULT" | jq -r '.data.pod.desiredStatus // "UNKNOWN"')
            UPTIME=$(echo "$RESULT" | jq -r '.data.pod.runtime.uptimeInSeconds // "null"')

            echo "[CHECK ${i}/60] status=${STATUS}, uptime=${UPTIME}s"

            # update 후 재기동이면 uptime이 다시 작아지는 게 정상.
            if [ "$STATUS" = "RUNNING" ] && [ "$UPTIME" != "null" ] && [ "$UPTIME" -ge 10 ] 2>/dev/null; then
              echo "[OK] Pod is RUNNING (uptime: ${UPTIME}s)"
              exit 0
            fi

            sleep 10
          done

          echo "[FAIL] Pod did not reach RUNNING state within 10 minutes"
          exit 1

      - name: Health Check (Pod Status Polling)
        run: |
          echo "[INFO] Waiting for RunPod pod to be RUNNING..."
          for i in $(seq 1 40); do
            RESULT=$(curl -sf -X POST "https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "query { pod(input: { podId: \"${{ secrets.POD_ID }}\" }) { desiredStatus runtime { uptimeInSeconds } } }"
              }')

            STATUS=$(echo "$RESULT" | jq -r '.data.pod.desiredStatus // "UNKNOWN"')
            UPTIME=$(echo "$RESULT" | jq -r '.data.pod.runtime.uptimeInSeconds // "null"')

            echo "[CHECK ${i}/40] status=${STATUS}, uptime=${UPTIME}s"

            if [ "$STATUS" = "RUNNING" ] && [ "$UPTIME" != "null" ] && [ "$UPTIME" -gt 0 ] 2>/dev/null; then
              echo "[OK] Pod is RUNNING (uptime: ${UPTIME}s)"
              exit 0
            fi

            sleep 15
          done

          echo "[FAIL] Pod did not reach RUNNING state within 10 minutes"
          exit 1

      - name: Notify Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CD }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            TITLE="AI OCR 배포 성공"
            DESC="RunPod에 \`${{ env.IMAGE_TAG }}\` 배포 완료"
            COLOR=3066993
          else
            TITLE="AI OCR 배포 실패"
            DESC="RunPod 배포에 실패했습니다. Actions 로그를 확인해주세요."
            COLOR=15158332
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg tag "${{ env.IMAGE_TAG }}" \
            --arg url "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  {name: "브랜치", value: $branch, inline: true},
                  {name: "버전", value: ("`" + $tag + "`"), inline: true},
                  {name: "상세", value: ("[Actions 로그](" + $url + ")"), inline: false}
                ],
                footer: {
                  text: "AI OCR Deploy"
                }
              }]
            }' | curl -sf -X POST "$WEBHOOK" -H "Content-Type: application/json" -d @-
