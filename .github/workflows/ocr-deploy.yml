name: Build and Deploy to RunPod

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/ocr/**'
      - '.github/workflows/ocr-deploy.yml'

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: ktb_final_ocr
  TEMPLATE_ID: ${{ secrets.TEMPLATE_ID }}
  IMAGE_TAG: ${{ github.sha }} 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./services/ocr
          file: ./services/ocr/Dockerfile 
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # 16GB 대용량 빌드 속도를 위한 캐시 설정
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Update RunPod Template
        run: |
          curl -X POST https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }} \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation { saveTemplate(input: { id: \"1sljntpsm2\", name: \"${{ env.IMAGE_NAME }}\", imageName: \"${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\" }) { id } }"
          }'

      - name: Update and Restart RunPod Instance
        run: |
          curl -X POST https://api.runpod.io/graphql?api_key=${{ secrets.RUNPOD_API_KEY }} \
          -H "Content-Type: application/json" \
          -d '{
            "query": "mutation { podEditJob(input: { podId: \"${{ secrets.POD_ID }}\", imageName: \"${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}\" }) { id imageName } }"
          }'